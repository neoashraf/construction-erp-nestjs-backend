name: Deploy to Hostinger (self-hosted)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ze-erp-backend-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy:
    name: Build and restart ze-erp-backend
    needs: test

    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Debug environment
        shell: bash
        run: |
          echo "========== DEBUG =========="

          echo "User:"
          whoami

          echo ""
          echo "PWD:"
          pwd

          echo ""
          echo "HOME:"
          echo "$HOME"

          echo ""
          echo "ROOT DIRECTORY:"
          ls -lah /root || true

          echo ""
          echo "ROOT ZAKIR ERP:"
          ls -lah /root/zakir-erp || true

          echo ""
          echo "ROOT BACKEND:"
          ls -lah /root/zakir-erp/backend || true

          echo ""
          echo "ROOT ENV:"
          ls -lah /root/zakir-erp/backend/.env || true

          echo ""
          echo "HOME ZAKIR ERP:"
          ls -lah "$HOME/zakir-erp" || true

          echo ""
          echo "HOME BACKEND:"
          ls -lah "$HOME/zakir-erp/backend" || true

          echo ""
          echo "HOME ENV:"
          ls -lah "$HOME/zakir-erp/backend/.env" || true

          echo ""
          echo "WORKSPACE:"
          ls -lah

          echo ""
          echo "========== END DEBUG =========="

      - name: Load server env file
        shell: bash
        run: |
          SERVER_ENV="/root/zakir-erp/backend/.env"

          echo "Trying to load: $SERVER_ENV"

          if [ -f "$SERVER_ENV" ]; then
            cp "$SERVER_ENV" .env
            echo "Loaded server env file"
            ls -lah .env
          else
            echo "Server env file not found at $SERVER_ENV"
            exit 1
          fi

      - name: Build and restart containers
        shell: bash
        run: |
          docker compose up -d --build --remove-orphans

      - name: Wait for health check
        shell: bash
        run: |
          for attempt in $(seq 1 15); do
            if curl -sf http://localhost:7001/health > /dev/null; then
              echo "Healthy"
              exit 0
            fi

            echo "Waiting for app to become healthy... attempt ${attempt}/15"
            sleep 3
          done

          echo "App did not become healthy in time — last logs:"
          docker compose logs --tail=100 ze-erp-backend || true
          exit 1

      - name: Show running containers
        shell: bash
        run: |
          docker compose ps

      - name: Prune old images
        shell: bash
        run: |
          docker image prune -f
