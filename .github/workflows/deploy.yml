name: Deploy to Hostinger (self-hosted)

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      seed_database:
        description: "Seed demo ERP data after deploy"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ze-erp-backend-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    name: Build and restart ze-erp-backend
    needs: test
    runs-on: [self-hosted, linux, ze-erp-vps]

    steps:
      - name: Debug runner
        shell: bash
        run: |
          echo "================================="
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "HOSTNAME=$(hostname)"
          echo "USER=$(whoami)"
          echo "HOME=$HOME"
          echo "PWD=$(pwd)"
          echo "================================="

      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Debug environment
        shell: bash
        run: |
          echo "========== DEBUG =========="

          echo "User:"
          whoami

          echo ""
          echo "PWD:"
          pwd

          echo ""
          echo "HOME:"
          echo "$HOME"

          echo ""
          echo "=== Current Directory ==="
          ls -lah

          echo ""
          echo "=== /root ==="
          ls -lah /root || true

          echo ""
          echo "=== /root/zakir-erp ==="
          ls -lah /root/zakir-erp || true

          echo ""
          echo "=== /root/zakir-erp/backend ==="
          ls -lah /root/zakir-erp/backend || true

          echo ""
          echo "=== ENV FILE ==="
          ls -lah /root/zakir-erp/backend/.env || true

          echo ""
          echo "========== END DEBUG =========="

      - name: Load server env file
        shell: bash
        run: |
          SERVER_ENV="/root/zakir-erp/backend/.env"

          if [ -f "$SERVER_ENV" ]; then
            cp "$SERVER_ENV" .env
            echo "Loaded server env file from $SERVER_ENV"
          else
            echo "Server env file not found at $SERVER_ENV"
            exit 1
          fi

          echo "Env file present"

      - name: Build and restart containers
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose --env-file /opt/ze-erp/.env up -d --build --remove-orphans

      - name: Wait for health check
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:7001/health >/dev/null; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for app... attempt ${attempt}/20"
            sleep 3
          done

          echo "Health check failed"

          docker compose --env-file /opt/ze-erp/.env ps || true
          docker compose --env-file /opt/ze-erp/.env logs --tail=100 ze-erp-backend || true

          exit 1

      - name: Seed demo data
        if: github.event_name == 'workflow_dispatch' && inputs.seed_database == 'true'
        shell: bash
        run: docker compose run --rm seed

      - name: Show running containers
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose --env-file /opt/ze-erp/.env ps

      - name: Prune old images
        shell: bash
        run: |
          docker image prune -f
