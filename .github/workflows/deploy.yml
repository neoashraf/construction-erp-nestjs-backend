name: Deploy to Hostinger (self-hosted)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ze-erp-backend-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    name: Build and restart ze-erp-backend
    needs: test

    runs-on:
      - self-hosted

    steps:
      - name: Debug Runner
        run: |
          echo "HOSTNAME=$(hostname)"
          echo "USER=$(whoami)"
          echo "HOME=$HOME"

      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Show filesystem
        run: |
          pwd
          ls -lah
          ls -lah /root || true
          ls -lah /root/zakir-erp || true
          ls -lah /root/zakir-erp/backend || true
          ls -lah /root/zakir-erp/backend/.env || true

      - name: Load server env file
        shell: bash
        run: |
          SERVER_ENV="/root/zakir-erp/backend/.env"

          echo "Trying to load: $SERVER_ENV"

          if [ -f "$SERVER_ENV" ]; then
            cp "$SERVER_ENV" .env
            echo "Loaded server env file"
            ls -lah .env
          else
            echo "Server env file not found at $SERVER_ENV"
            exit 1
          fi

      - name: Build and restart containers
        run: |
          docker compose up -d --build --remove-orphans

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 15); do
            if curl -sf http://localhost:7001/health >/dev/null; then
              echo "Healthy"
              exit 0
            fi

            echo "Waiting... ${attempt}/15"
            sleep 3
          done

          docker compose logs --tail=100 ze-erp-backend
          exit 1

      - name: Show containers
        run: docker compose ps

      - name: Prune images
        run: docker image prune -f
