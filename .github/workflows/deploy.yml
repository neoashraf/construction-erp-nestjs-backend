name: Deploy(self-hosted)

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch: {}

# Scope concurrency per branch so a push to `main` never cancels an in-flight
# `dev` run (and vice-versa); only a newer push to the SAME branch supersedes.
concurrency:
  group: ze-erp-backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    # Guardrail: the Testcontainers int-specs are slow; fail fast on a genuine hang
    # instead of running to a runner limit and reporting an ambiguous cancellation.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy-home:
    name: Deploy to Home Server
    if: github.ref == 'refs/heads/dev'
    needs: test
    runs-on: [self-hosted, ze-erp-home]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Load server env file
        shell: bash
        run: |
          SERVER_ENV="/root/zakir-erp/ze-erp-nestjs-backend/.env"

          if [ -f "$SERVER_ENV" ]; then
            cp "$SERVER_ENV" .env
            echo "Loaded server env file from $SERVER_ENV"
          else
            echo "Server env file not found at $SERVER_ENV"
            exit 1
          fi

          echo "Env file present"

      - name: Build and restart containers
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose up -d --build --remove-orphans

      - name: Wait for health check
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:7001/health >/dev/null; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for app... attempt ${attempt}/20"
            sleep 3
          done

          echo "Health check failed"

          docker compose ps || true
          docker compose logs --tail=100 ze-erp-backend || true

          exit 1

      - name: Seed demo data
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose run -T --rm --build seed npm run seed:all

      - name: Show running containers
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose ps

      - name: Prune old images
        shell: bash
        run: |
          docker image prune -f

  deploy-hostinger:
    name: Deploy to Hostinger VPS
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, zakir-erp-hostinger]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Load server env file
        shell: bash
        run: |
          SERVER_ENV="/root/zakir-erp/ze-erp-nestjs-backend/.env"

          if [ -f "$SERVER_ENV" ]; then
            cp "$SERVER_ENV" .env
            echo "Loaded server env file from $SERVER_ENV"
          else
            echo "Server env file not found at $SERVER_ENV"
            exit 1
          fi

          echo "Env file present"

      - name: Build and restart containers
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose up -d --build --remove-orphans

      - name: Wait for health check
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:7001/health >/dev/null; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for app... attempt ${attempt}/20"
            sleep 3
          done

          echo "Health check failed"

          docker compose ps || true
          docker compose logs --tail=100 ze-erp-backend || true

          exit 1

      - name: Seed demo data
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose run -T --rm --build seed npm run seed:all

      - name: Show running containers
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose ps

      - name: Prune old images
        shell: bash
        run: |
          docker image prune -f
